name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests (Surefire)
        run: mvn -B test

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb


      - name: Integration tests (Failsafe + TestFX)
        run: |
          xvfb-run -a mvn -B failsafe:integration-test failsafe:verify \
            -Dtestfx.robot=glass \
            -Dprism.order=sw \
            -Djava.awt.headless=false

